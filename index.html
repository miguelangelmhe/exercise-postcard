<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="postcard">
			<div class="postcard-header">
				<h1>My Postcard</h1>
				<img
					src="https://raw.githubusercontent.com/breatheco-de/exercise-postcard/e63a7916530cc850bd92aa1c2e19191837fb5c80/.learn/assets/4geeks.png"
					alt="Logo"
				/>
			</div>
			<div class="postcard-body">
				<div class="body-left">
					<p>
						¡Mira que guay! Esta es una postal que he creado usando HTML5 y CSS3 durante mi curso de 4Geeks Academy. <br />
						Es genial, no puedo esperar a crear nuevas cosas.
					</p>
				</div>
				<div class="body-right">
					<input type="text" placeholder="Algún nombre" />
					<input type="email" placeholder="Algún email" />
					<textarea placeholder="Algún comentario"></textarea>
				</div>
			</div>
			<div class="postcard-footer">
				<button>Send My Postcard</button>
			</div>
		</div>
	</body>
</html>
